    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        /* ==========================================================================
           CSS Styling
           ========================================================================== */
        
        :root {
            --text-color: #212529;
            --compliment-btn: #FF6B6B;
            --joke-btn: #4ECDC4;
            --punchline-color: #e73c7e;
            --btn-hover: #FFD166;
            --font-display: 'Nunito', sans-serif;
            --font-ui: 'Lato', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .playing-card {
            width: 320px;
            height: 448px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Glass Shine Effect */
        .playing-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            transform: skewX(-25deg);
            pointer-events: none;
        }

        .playing-card.animate-shine::after {
            animation: singleShine 0.8s ease-out forwards;
        }

        @keyframes singleShine {
            0% { left: -150%; }
            100% { left: 250%; }
        }

        /* Dynamic Corner Circles */
        .corner-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.5s ease;
        }

        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }

        #content-display {
            font-family: var(--font-display);
            font-size: 1.5rem;
            line-height: 1.4;
            text-align: center;
            color: var(--text-color);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 1;
            transform: scale(1);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #content-display.hide {
            opacity: 0;
            transform: scale(0.85);
        }

        /* Spinner Styles */
        #spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(231, 60, 126, 0.1);
            border-top: 3px solid var(--punchline-color);
            border-radius: 50%;
            margin-top: 20px;
            display: none;
        }

        .show-spinner #spinner {
            display: block;
            animation: spinLoop 1s linear infinite;
        }

        @keyframes spinLoop {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #punchline {
            display: block;
            margin-top: 15px;
            font-weight: 700;
            color: var(--punchline-color);
            opacity: 0;
            height: 0;
            overflow: hidden;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        #punchline.visible {
            opacity: 1;
            height: auto;
            transform: translateY(0);
        }

        /* Controls Area */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            font-family: var(--font-ui);
            color: #ffffff; 
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px; 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        #compliment-btn { background: linear-gradient(135deg, var(--compliment-btn), #ff8e8e); }
        #joke-btn { background: linear-gradient(135deg, var(--joke-btn), #34e89e); }

        .action-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .action-btn:active { transform: scale(0.95) translateY(2px); }

        @media (max-width: 400px) {
            .playing-card { width: 300px; height: 420px; padding: 30px; }
            #content-display { font-size: 1.3rem; }
        }
    </style>
</head>
